services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homework_bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: change_this_local_password
    volumes:
      - todo_bot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d homework_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Create .env from .env.example and add the bot token}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Moscow}
      DATABASE_URL: postgres://bot_user:change_this_local_password@postgres:5432/homework_bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  todo_bot_postgres_data:
