<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Задания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link id="neon-theme-stylesheet" rel="stylesheet" href="neon-theme.css" disabled>
</head>
<body>
<div class="app">
  <header class="header">
    <h1 id="app-title" data-i18n="appTitle">Задания</h1>
    <div class="header-actions">
      <button id="settings-toggle" class="icon-button icon-button--ghost" type="button" aria-label="Настройки" data-i18n-aria="settingsAria">⚙</button>
      <button id="add-toggle" class="icon-button" type="button" aria-label="Добавить задание" data-i18n-aria="addTaskAria">+</button>
    </div>
  </header>

  <form id="settings-form" class="add-form hidden">
    <p class="form-title" data-i18n="settingsTitle">Настройки</p>
    <fieldset class="reminder-setting">
      <legend data-i18n="reminderTimesLabel">Время напоминаний каждый день</legend>
      <div id="reminder-times" class="reminder-times"></div>
      <button type="button" id="add-reminder-time" class="button secondary add-reminder-time" data-i18n="addReminderTime">Добавить время</button>
    </fieldset>
    <div class="language-setting">
      <span class="language-label" data-i18n="languageLabel">Язык</span>
      <div class="language-picker">
        <select id="language-select" class="language-select" aria-label="Язык" data-i18n-aria="languageLabel">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
          <option value="hy">Հայերեն</option>
        </select>
      </div>
    </div>
    <div class="theme-setting">
      <span class="language-label" data-i18n="designLabel">Оформление</span>
      <div class="language-picker theme-picker" role="group" aria-label="Оформление" data-i18n-aria="designLabel">
        <button class="theme-option" type="button" data-theme="classic" data-i18n="designClassic">Обычное</button>
        <button class="theme-option" type="button" data-theme="neon" data-i18n="designNeon">Неоновое</button>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" id="cancel-settings" class="button secondary" data-i18n="cancel">Отмена</button>
      <button type="submit" class="button primary" data-i18n="save">Сохранить</button>
    </div>
    <p id="settings-error" class="error hidden"></p>
  </form>

  <form id="add-form" class="add-form hidden">
    <p id="form-title" class="form-title" data-i18n="newTask">Новое задание</p>
    <label>
      <span data-i18n="subject">Предмет</span>
      <input id="field-subject" type="text" placeholder="Разработка ПО (необязательно)" data-i18n-placeholder="subjectPlaceholder" maxlength="200">
    </label>
    <label>
      <span data-i18n="task">Задание</span>
      <input id="field-title" type="text" placeholder="Практическая 1" data-i18n-placeholder="taskPlaceholder" required maxlength="300">
    </label>
    <label>
      <span data-i18n="deadline">Дедлайн</span>
      <span class="date-picker-control">
        <span id="deadline-display" class="date-picker-display">ДД.ММ.ГГГГ</span>
        <span class="date-picker-icon" aria-hidden="true">▦</span>
        <input id="field-deadline" type="date" aria-label="Дедлайн" data-i18n-aria="deadline" required>
      </span>
    </label>
    <label><span data-i18n="priorityLabel">Важность</span><select id="field-priority"><option value="low" data-i18n="priorityLow">Низкая</option><option value="medium" selected data-i18n="priorityMedium">Обычная</option><option value="high" data-i18n="priorityHigh">Срочная</option></select></label>
    <label><span data-i18n="noteLabel">Заметка</span><textarea id="field-note" maxlength="2000" rows="3" data-i18n-placeholder="notePlaceholder" placeholder="Дополнительные детали"></textarea></label>
    <fieldset class="reminder-setting task-reminder-setting">
      <legend data-i18n="reminderDaysLabel">Напомнить за</legend>
      <div class="task-reminder-control">
        <input id="task-reminder-days" type="range" min="1" max="20" value="7" aria-describedby="task-reminder-value">
        <output id="task-reminder-value" for="task-reminder-days" aria-live="polite">7</output>
      </div>
    </fieldset>
    <div class="form-actions">
      <button type="button" id="cancel-add" class="button secondary" data-i18n="cancel">Отмена</button>
      <button type="submit" class="button primary" data-i18n="save">Сохранить</button>
    </div>
    <p id="form-error" class="error hidden"></p>
  </form>

  <form id="event-form" class="add-form hidden">
    <p class="form-title" data-i18n="newEvent">Новое событие</p>
    <label><span data-i18n="eventTitle">Событие</span><input id="event-title" type="text" maxlength="300" required></label>
    <label><span data-i18n="eventDateTime">Дата и время</span><input id="event-date-time" type="datetime-local" required></label>
    <label><span data-i18n="remindHours">Напомнить за (часов)</span><input id="event-reminder-hours" type="number" min="0" max="168" value="1" required></label>
    <div class="form-actions"><button type="button" id="cancel-event" class="button secondary" data-i18n="cancel">Отмена</button><button type="submit" class="button primary" data-i18n="save">Сохранить</button></div>
    <p id="event-error" class="error hidden"></p>
  </form>

  <p id="status" class="status"></p>

  <nav class="sections" aria-label="Разделы заданий" data-i18n-aria="sectionsAria">
    <button class="section-button active" type="button" data-section="uncompleted" data-i18n="uncompleted">Несделанные</button>
    <button class="section-button" type="button" data-section="completed" data-i18n="archive">Архив</button>
    <button class="section-button" type="button" data-section="overdue" data-i18n="overdue">Просроченные</button>
    <button class="section-button" type="button" data-section="analytics" data-i18n="analytics">Аналитика</button>
    <button class="section-button" type="button" data-section="calendar" data-i18n="calendar">Постоянные</button>
  </nav>

  <div id="task-filters" class="task-filters">
    <select id="priority-filter" aria-label="Фильтр по важности" data-i18n-aria="priorityFilterAria"><option value="all" data-i18n="filterAllPriorities">Любая важность</option><option value="low" data-i18n="priorityLow">Низкая</option><option value="medium" data-i18n="priorityMedium">Обычная</option><option value="high" data-i18n="priorityHigh">Срочная</option></select>
    <input id="note-filter" type="search" placeholder="Поиск по заметкам" data-i18n-placeholder="noteFilterPlaceholder">
  </div>
  <section id="calendar" class="calendar-panel hidden" aria-label="Календарь">
    <div class="month-filter"><button id="calendar-prev" class="month-arrow" type="button" aria-label="Предыдущий месяц">&#8249;</button><strong id="calendar-month" class="calendar-month"></strong><button id="calendar-next" class="month-arrow" type="button" aria-label="Следующий месяц">&#8250;</button></div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div class="calendar-day-heading"><div><span class="calendar-kicker" data-i18n="eventsForDay">События дня</span><h2 id="calendar-day-title"></h2></div><button type="button" id="calendar-add-event" class="button primary" data-i18n="addEvent">+ Событие</button></div>
    <ul id="event-list" class="list"></ul>
    <p id="event-empty" class="empty hidden"></p>
  </section>

  <section id="analytics" class="analytics hidden" aria-label="Аналитика" data-i18n-aria="analytics">
    <div class="month-filter">
      <button id="month-prev" class="month-arrow" type="button" aria-label="Предыдущий месяц" data-i18n-aria="previousMonth">&#8249;</button>
      <label class="month-picker-control">
        <span class="visually-hidden" data-i18n="analyticsMonth">Месяц аналитики</span>
        <span id="month-picker-label" class="month-picker-label" aria-hidden="true">Октябрь 2026</span>
        <input id="month-picker" type="month" aria-label="Месяц аналитики" data-i18n-aria="analyticsMonth">
      </label>
      <button id="month-next" class="month-arrow" type="button" aria-label="Следующий месяц" data-i18n-aria="nextMonth">&#8250;</button>
    </div>
    <p id="week-range" class="week-range"></p>
    <div class="analytics-grid">
      <article class="stat-card"><span data-i18n="doneThisWeek">Сделано за неделю</span><strong id="stat-completed">0</strong></article>
      <article class="stat-card stat-card--month"><span data-i18n="doneThisMonth">Сделано за месяц</span><strong id="stat-month-completed">0</strong></article>
      <article class="stat-card"><span data-i18n="doneOnTime">Выполнено в срок</span><strong id="stat-on-time">0</strong></article>
      <article class="stat-card"><span data-i18n="uncompletedTotal">Несделано всего</span><strong id="stat-uncompleted">0</strong></article>
      <article class="stat-card stat-card--overdue"><span data-i18n="overdueTotal">Просрочено</span><strong id="stat-overdue">0</strong></article>
    </div>
    <section class="chart-panel">
      <h2 data-i18n="currentWeek">Текущая неделя</h2>
      <div id="week-chart" class="line-chart line-chart--week"></div>
    </section>
    <section class="chart-panel">
      <h2 id="month-chart-title">За месяц</h2>
      <div class="chart-scroll"><div id="month-chart" class="line-chart line-chart--month"></div></div>
    </section>
  </section>

  <ul id="list" class="list"></ul>

  <p id="empty-state" class="empty hidden"></p>
</div>

<script src="app.js"></script>
</body>
</html>
