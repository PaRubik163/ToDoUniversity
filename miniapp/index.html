<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Задания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Задания</h1>
    <div class="header-actions">
      <button id="settings-toggle" class="icon-button icon-button--ghost" type="button" aria-label="Настройки напоминаний">⚙</button>
      <button id="add-toggle" class="icon-button" type="button" aria-label="Добавить задание">+</button>
    </div>
  </header>

  <form id="settings-form" class="add-form hidden">
    <p class="form-title">Время напоминаний</p>
    <label>
      <span>Напоминать каждый день в</span>
      <input id="field-remind-time" type="time" required>
    </label>
    <div class="form-actions">
      <button type="button" id="cancel-settings" class="button secondary">Отмена</button>
      <button type="submit" class="button primary">Сохранить</button>
    </div>
    <p id="settings-error" class="error hidden"></p>
  </form>

  <form id="add-form" class="add-form hidden">
    <p id="form-title" class="form-title">Новое задание</p>
    <label>
      <span>Предмет</span>
      <input id="field-subject" type="text" placeholder="Разработка безопасного ПО" required maxlength="200">
    </label>
    <label>
      <span>Задание</span>
      <input id="field-title" type="text" placeholder="Практическая 1" required maxlength="300">
    </label>
    <label>
      <span>Дедлайн</span>
      <input id="field-deadline" type="date" required>
    </label>
    <div class="form-actions">
      <button type="button" id="cancel-add" class="button secondary">Отмена</button>
      <button type="submit" class="button primary">Сохранить</button>
    </div>
    <p id="form-error" class="error hidden"></p>
  </form>

  <p id="status" class="status"></p>

  <nav class="sections" aria-label="Разделы заданий">
    <button class="section-button active" type="button" data-section="uncompleted">Несделанные</button>
    <button class="section-button" type="button" data-section="completed">Сделанные</button>
    <button class="section-button" type="button" data-section="overdue">Просроченные</button>
    <button class="section-button" type="button" data-section="analytics">Аналитика</button>
  </nav>

  <section id="analytics" class="analytics hidden" aria-label="Аналитика">
    <div class="month-filter">
      <button id="month-prev" class="month-arrow" type="button" aria-label="Предыдущий месяц">‹</button>
      <label><span class="visually-hidden">Месяц аналитики</span><input id="month-picker" type="month"></label>
      <button id="month-next" class="month-arrow" type="button" aria-label="Следующий месяц">›</button>
    </div>
    <p id="week-range" class="week-range"></p>
    <div class="analytics-grid">
      <article class="stat-card"><span>Сделано за неделю</span><strong id="stat-completed">0</strong></article>
      <article class="stat-card stat-card--month"><span>Сделано за месяц</span><strong id="stat-month-completed">0</strong></article>
      <article class="stat-card"><span>Несделано всего</span><strong id="stat-uncompleted">0</strong></article>
      <article class="stat-card stat-card--overdue"><span>Просрочено</span><strong id="stat-overdue">0</strong></article>
    </div>
    <section class="chart-panel">
      <h2>Текущая неделя</h2>
      <div id="week-chart" class="line-chart line-chart--week"></div>
    </section>
    <section class="chart-panel">
      <h2 id="month-chart-title">За месяц</h2>
      <div class="chart-scroll"><div id="month-chart" class="line-chart line-chart--month"></div></div>
    </section>
  </section>

  <ul id="list" class="list"></ul>

  <p id="empty-state" class="empty hidden"></p>
</div>

<script src="app.js"></script>
</body>
</html>
